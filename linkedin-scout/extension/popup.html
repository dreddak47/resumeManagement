<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; color: #1d2226; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .status { background: #f3f2ef; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; white-space: pre-line; }
  .err { color: #b3261e; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  input[type=number] { width: 60px; }
  button { width: 100%; padding: 8px; margin-top: 6px; border: 0; border-radius: 16px; cursor: pointer; font-weight: 600; }
  #scan { background: #0a66c2; color: #fff; }
  #dash { background: #e8f0fb; color: #0a66c2; }
</style>
</head>
<body>
  <h1>LinkedIn Scout</h1>
  <div class="status" id="status">No scan yet.</div>
  <label>Scan automatically <input type="checkbox" id="enabled"></label>
  <label>Every (minutes) <input type="number" id="intervalMin" min="5"></label>
  <label>Scroll steps per scan <input type="number" id="scrolls" min="3" max="60"></label>
  <button id="scan">Scan now</button>
  <button id="dash">Open dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
